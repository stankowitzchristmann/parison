[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parison"
version = "1.0.0"
description = "Therapy-conditioned multimodal selective state-space digital twin for intracranial-pressure forecasting in severe traumatic brain injury"
requires-python = "==3.8.*"
authors = [{ name = "Neurocritical Edge-AI Group" }]
license = { text = "MIT" }
dependencies = [
    "torch==1.13.1",
    "numpy==1.23.5",
    "scipy==1.9.3",
    "pydantic==2.5.3",
    "tomli==2.0.1",
]

[project.optional-dependencies]
export = ["onnx==1.13.1", "onnxruntime==1.13.1"]
dev = [
    "pytest==7.4.4",
    "ruff==0.1.14",
    "black==23.12.1",
    "isort==5.13.2",
    "mypy==1.8.0",
    "pre-commit==3.5.0",
]

[project.scripts]
parison = "parison.pipe.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "I", "W", "B", "UP", "SIM"]
ignore = ["B905"]

[tool.ruff.per-file-ignores]
"proofs/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_subclassing_any = false
disallow_untyped_decorators = false
disable_error_code = ["no-any-return", "no-untyped-call"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["proofs"]
