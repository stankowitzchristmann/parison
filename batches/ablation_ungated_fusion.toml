name = "ablation_ungated_fusion"

[glass]
d_model = 172
d_state = 16
depth = 4
dt_rank = 8
modalities = ["icp", "abp", "ecg", "ehr"]
action_dim = 6
action_levels = 5
horizon = 30
lead_window = 30
condition = true
gated_fusion = false

[feed]
window_steps = 360
icp_threshold = 22.0
sustained_steps = 10
ehr_dim = 24
cohort = 1024
drop_rate = 0.15

[oven]
lr = 3.0e-4
warmup_steps = 2000
max_epochs = 100
early_stop_patience = 12
outcome_weight = 0.5

[bench]
per_device_batch = 32
grad_accum = 16
world_size = 8
precision = "fp32"
seed = 0
adapt_steps = 24
