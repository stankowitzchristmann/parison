early_stop_patience = 12
forecast_weight = 1.0
warning_weight = 0.5
outcome_weight = 0.25

[bench]
per_device_batch = 32
grad_accum = 16
world_size = 8
precision = "fp32"
seed = 0
adapt_steps = 48
adapt_lr = 5.0e-4
adapt_window = 180
