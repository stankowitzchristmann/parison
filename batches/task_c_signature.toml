name = "task_c_signature"

[glass]
d_model = 172
d_state = 16
depth = 4
dt_rank = 8
modalities = ["icp", "abp", "ecg", "ehr"]
action_dim = 6
action_levels = 5
horizon = 30
lead_window = 30
condition = true
gated_fusion = true

[feed]
window_steps = 360
icp_threshold = 22.0
sustained_steps = 10
